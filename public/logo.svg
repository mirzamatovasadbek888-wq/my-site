<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">
  <!-- Градиент для звезды и орбиты -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>

  <!-- Звезда (упрощенная версия твоего логотипа) -->
  <g fill="url(#grad)">
    <!-- Верхняя левая часть звезды -->
    <path d="M240 60 L270 150 L220 140 Z"/>
    <!-- Верхняя правая часть звезды -->
    <path d="M280 60 L250 150 L300 140 Z"/>
    <!-- Нижняя левая часть звезды -->
    <path d="M220 240 L270 180 L250 250 Z"/>
    <!-- Нижняя правая часть звезды -->
    <path d="M320 240 L280 180 L300 250 Z"/>
    <!-- Центральный ромб -->
    <path d="M260 120 L280 170 L260 220 L240 170 Z"/>
  </g>

  <!-- Орбита (эллипс) -->
  <ellipse cx="250" cy="165" rx="100" ry="20" fill="none" stroke="#FFFFFF" stroke-width="6" transform="rotate(-15 250 165)"/>

  <!-- Вертикальная линия -->
  <rect x="380" y="90" width="6" height="100" fill="#FFFFFF" />

  <!-- Текст ASRO -->
  <text x="420" y="175" font-family="Arial, sans-serif" font-weight="900" font-size="90" fill="#FFFFFF" letter-spacing="5">ASRO</text>
</svg>
